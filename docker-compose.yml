version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vorticast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vorticast
      POSTGRES_PASSWORD: vorticast_password
      POSTGRES_DB: vorticast
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
